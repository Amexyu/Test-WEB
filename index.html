<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试网页</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">

        <div id="homeScreen">
            <h1>欢迎来到我的测试网页</h1>
            <p class="desc">这是一个简单的性格测试练习网页</p>
            <button id="startBtn">开始测试</button>
        </div>



        <div id="quizScreen" class="hidden">
            <h2 id="questionText">这里之后会显示题目</h2>
            <div class="options">
                <button class="optionBtn">选项A</button>
                <button class="optionBtn">选项B</button>
            </div>
            <button id="restatrBtn" class="hidden">再来一次</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
